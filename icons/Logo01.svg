<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <!-- Click / Action Rays (Aligned directly around the tip) -->
  <g stroke="#2C3336" stroke-width="22" stroke-linecap="round">
    <!-- Top Vertical Ray -->
    <line x1="250" y1="105" x2="250" y2="60" />
    
    <!-- Top-Left Diagonal Ray -->
    <line x1="212" y1="118" x2="180" y2="86" />
    
    <!-- Top-Right Diagonal Ray -->
    <line x1="288" y1="118" x2="320" y2="86" />
    
    <!-- Right Horizontal Ray -->
    <line x1="295" y1="150" x2="340" y2="150" />
    
    <!-- Bottom-Right Diagonal Ray -->
    <line x1="285" y1="185" x2="317" y2="217" />
  </g>

  <!-- Main Pointer Cursor -->
  <!-- Rotated 45 degrees around its tip (250, 150) to point exactly up-right -->
  <g transform="rotate(45, 250, 150)">
    <path 
      d="M 250,150 
         L 140,275 
         L 215,265 
         L 215,395 
         L 285,395 
         L 285,265 
         L 360,275 
         Z" 
      fill="#2C3336" 
      stroke="#2C3336" 
      stroke-width="36" 
      stroke-linejoin="round" 
      stroke-linecap="round" 
    />
  </g>
</svg>
