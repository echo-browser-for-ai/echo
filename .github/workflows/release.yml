# Echo — CI Release Pipeline (GitHub Actions)
#
# What this does: builds the Windows installer on GitHub's machines from this
# exact public source — no local machine needed. This is also the automated
# build SignPath Foundation requires for code signing.
#
# How to run:
#   - Dry run:  Actions tab -> "Release" -> "Run workflow"
#               (builds only; the installer is downloadable from the run page)
#   - Release:  push a version tag, e.g.  git tag v0.2.4 && git push origin v0.2.4
#               (builds AND publishes the installer to GitHub Releases)
#
# No secrets required:
#   - the extension .crx is committed (built from resources/echo-extension)
#   - the Chromium engine is fetched from the "chromium-latest" release
#   - node.exe and the runtime node_modules are staged fresh on every build

name: Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  build:
    name: Build Windows installer
    runs-on: windows-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Stage portable Node runtime (node.exe)
        shell: pwsh
        run: |
          $nodeVersion = "20.18.3"
          Invoke-WebRequest -Uri "https://nodejs.org/dist/v$nodeVersion/node-v$nodeVersion-win-x64.zip" -OutFile "$env:RUNNER_TEMP\node.zip"
          Expand-Archive "$env:RUNNER_TEMP\node.zip" -DestinationPath "$env:RUNNER_TEMP\node-extract" -Force
          Copy-Item "$env:RUNNER_TEMP\node-extract\node-v$nodeVersion-win-x64\node.exe" "build/installer/resources/node.exe"

      - name: Stage runtime node_modules
        shell: pwsh
        run: |
          $dest = "build/installer/resources/node_modules"
          New-Item -ItemType Directory -Force $dest | Out-Null
          Copy-Item "node_modules/@playwright" "$dest/@playwright" -Recurse -Force
          Copy-Item "node_modules/playwright-core" "$dest/playwright-core" -Recurse -Force
          Copy-Item "node_modules/ws" "$dest/ws" -Recurse -Force
          Copy-Item "node_modules/jsonc-parser" "$dest/jsonc-parser" -Recurse -Force
          Copy-Item "node_modules/@iarna" "$dest/@iarna" -Recurse -Force

      - name: Download Chromium engine (from chromium-latest release)
        shell: pwsh
        run: |
          $manifest = Invoke-RestMethod "https://github.com/echo-browser-for-ai/echo/releases/download/chromium-latest/chromium-latest.json"
          Write-Host "Engine: $($manifest.version) ($([math]::Round($manifest.size/1MB,1)) MB)"
          curl.exe -fL --retry 3 -o "$env:RUNNER_TEMP\engine.zip" $manifest.url
          $hash = (Get-FileHash "$env:RUNNER_TEMP\engine.zip" -Algorithm SHA256).Hash.ToLower()
          if ($hash -ne $manifest.sha256) { throw "Engine checksum mismatch!" }
          New-Item -ItemType Directory -Force "build/installer/resources/chromium" | Out-Null
          tar -xf "$env:RUNNER_TEMP\engine.zip" -C "build/installer/resources/chromium"

      - name: Build installer
        shell: pwsh
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: |
          npx tsc
          npx vite build
          npx electron-builder --win nsis --x64 --publish never

      - name: Verify artifacts
        shell: pwsh
        run: |
          Get-ChildItem release/EchoSetup -File | Select-Object Name, @{n='MB';e={[math]::Round($_.Length/1MB,1)}}
          Get-Content release/EchoSetup/latest.yml

      - name: Upload build artifact (available on every run)
        uses: actions/upload-artifact@v4
        with:
          name: echo-windows-installer
          path: |
            release/EchoSetup/Echo-Windows-*.exe
            release/EchoSetup/*.blockmap
            release/EchoSetup/latest.yml
          if-no-files-found: error

      - name: Publish to GitHub Releases (tag builds only)
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $files = Get-ChildItem release/EchoSetup -File | Where-Object { $_.Name -match '^Echo-Windows-.*(\.exe|\.blockmap)$' -or $_.Name -eq 'latest.yml' } | ForEach-Object { $_.FullName }
          gh release create $env:GITHUB_REF_NAME --repo echo-browser-for-ai/echo --title "Echo $env:GITHUB_REF_NAME" --notes "Built automatically by GitHub Actions from $env:GITHUB_REF_NAME." @files
