<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Echo PDF Viewer</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #525659; font-family: sans-serif; display: flex; flex-direction: column; align-items: center; padding: 16px; }
    .pdf-page { background: white; box-shadow: 0 2px 8px rgba(0,0,0,.3); margin-bottom: 16px; position: relative; }
    .pdf-page canvas { display: block; width: 100%; height: auto; }
    #controls { position: fixed; top: 0; left: 0; right: 0; background: #323639; color: white; padding: 8px 16px; display: flex; align-items: center; gap: 12px; z-index: 100; }
    #controls button { background: #5a5e62; color: white; border: none; padding: 6px 14px; border-radius: 4px; cursor: pointer; font-size: 13px; }
    #controls button:hover { background: #6c7074; }
    #controls span { font-size: 13px; }
    #pageInput { width: 50px; text-align: center; background: #525659; color: white; border: 1px solid #6c7074; border-radius: 3px; padding: 4px; }
    #loading { text-align: center; margin-top: 80px; color: #ccc; font-size: 16px; }
    #error { text-align: center; margin-top: 80px; color: #f88; font-size: 16px; display: none; }
    #textContent { display: none; }
    body.pdf-loaded { padding-top: 50px; }
  </style>
</head>
<body>
  <div id="controls">
    <button id="prevPage">&#9664;</button>
    <span>Page <input id="pageInput" type="number" value="1" min="1" /> / <span id="pageCount">-</span></span>
    <button id="nextPage">&#9654;</button>
    <span style="margin-left:auto;font-size:12px;color:#999;" id="filename"></span>
  </div>

  <div id="loading">Loading PDF...</div>
  <div id="error"></div>
  <div id="pagesContainer"></div>
  <div id="textContent"></div>

  <script src="pdf.min.mjs" type="module"></script>
  <script src="viewer.js" type="module"></script>
</body>
</html>
